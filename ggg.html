<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الثعبان</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #1a1a2e;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  h1 { margin-bottom: 10px; }
  canvas {
    background: #16213e;
    border: 3px solid #0f3460;
    border-radius: 8px;
  }
  #score {
    margin: 10px;
    font-size: 20px;
    color: #e94560;
  }
  #hint {
    margin-top: 8px;
    font-size: 14px;
    color: #888;
  }
</style>
</head>
<body>
  <h1>🐍 لعبة الثعبان</h1>
  <div id="score">النقاط: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="hint">استخدم الأسهم أو WASD للحركة | مسافة لإعادة اللعب</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const box = 20;
const cols = canvas.width / box;
const rows = canvas.height / box;

let snake, dir, nextDir, food, score, gameOver;

function init() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  placeFood();
  scoreEl.textContent = 'النقاط: 0';
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function update() {
  if (gameOver) return;

  if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
    dir = nextDir;
  }

  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    return endGame();
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'النقاط: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
}

function endGame() {
  gameOver = true;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 30px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('انتهت اللعبة!', canvas.width / 2, canvas.height / 2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = '18px Arial';
  ctx.fillText('اضغط مسافة للعب مجدداً', canvas.width / 2, canvas.height / 2 + 30);
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(food.x * box + box / 2, food.y * box + box / 2, box / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : '#0f9b6e';
    ctx.fillRect(s.x * box + 1, s.y * box + 1, box - 2, box - 2);
  });
}

function loop() {
  update();
  draw();
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k === 'arrowup' || k === 'w') && dir.y === 0) nextDir = {x: 0, y: -1};
  else if ((k === 'arrowdown' || k === 's') && dir.y === 0) nextDir = {x: 0, y: 1};
  else if ((k === 'arrowleft' || k === 'a') && dir.x === 0) nextDir = {x: -1, y: 0};
  else if ((k === 'arrowright' || k === 'd') && dir.x === 0) nextDir = {x: 1, y: 0};
  else if (k === ' ' && gameOver) init();

  if (k.startsWith('arrow')) e.preventDefault();
});

init();
setInterval(loop, 120);
</script>
</body>
</html>
